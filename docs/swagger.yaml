basePath: /
definitions:
  github_com_Mosteben_hotel-booking-system_internal_auth_model.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  github_com_Mosteben_hotel-booking-system_internal_auth_model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_Mosteben_hotel-booking-system_internal_auth_model.RegisterRequest:
    properties:
      address:
        type: string
      city:
        type: string
      confirm_password:
        type: string
      country:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      gender:
        enum:
        - male
        - female
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      national_id:
        type: string
      nationality:
        type: string
      passport_number:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      postal_code:
        type: string
      state:
        type: string
    required:
    - address
    - city
    - confirm_password
    - country
    - date_of_birth
    - email
    - first_name
    - gender
    - last_name
    - nationality
    - password
    - phone
    type: object
  github_com_Mosteben_hotel-booking-system_internal_auth_model.UpdateProfileRequest:
    properties:
      address:
        maxLength: 255
        type: string
      city:
        maxLength: 100
        type: string
      country:
        maxLength: 100
        type: string
      first_name:
        maxLength: 50
        minLength: 2
        type: string
      gender:
        enum:
        - male
        - female
        type: string
      last_name:
        maxLength: 50
        minLength: 2
        type: string
      national_id:
        maxLength: 50
        type: string
      nationality:
        maxLength: 100
        type: string
      passport_number:
        maxLength: 50
        type: string
      phone:
        maxLength: 20
        minLength: 10
        type: string
      postal_code:
        maxLength: 20
        type: string
      state:
        maxLength: 100
        type: string
    type: object
  github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking:
    properties:
      check_in:
        type: string
      check_out:
        type: string
      created_at:
        type: string
      guests:
        type: integer
      id:
        type: integer
      room_id:
        type: integer
      status:
        type: string
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_Mosteben_hotel-booking-system_internal_hotel_model.Hotel:
    properties:
      address:
        type: string
      city:
        type: string
      country:
        type: string
      created_at:
        type: string
      description:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      rooms:
        items:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_room_model.Room'
        type: array
      stars:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_Mosteben_hotel-booking-system_internal_room_model.Room:
    properties:
      capacity:
        type: integer
      created_at:
        type: string
      description:
        type: string
      hotel_id:
        type: integer
      id:
        type: integer
      price_per_night:
        type: number
      room_number:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: |-
    RESTful API for a Hotel Booking System built with Go, Gin, GORM, PostgreSQL, and JWT authentication.

    Features include authentication, hotel management, room management, bookings, availability, reviews, favorites, and payments.
  title: Hotel Booking System API
  version: "1.0"
paths:
  /auth/change-password:
    put:
      consumes:
      - application/json
      description: Change the authenticated user's password.
      parameters:
      - description: Password change data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_auth_model.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_auth_model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Authentication
  /auth/me:
    get:
      description: Return the authenticated user's information and profile.
      produces:
      - application/json
      responses:
        "200":
          description: Current user
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Authentication
  /auth/profile:
    put:
      consumes:
      - application/json
      description: Update the authenticated user's profile information.
      parameters:
      - description: Profile update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_auth_model.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with profile information.
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_auth_model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation failed
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Authentication
  /bookings:
    get:
      description: Get all bookings. Admin and manager users only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all bookings
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Create a new hotel room booking for the authenticated user.
      parameters:
      - description: Booking data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a booking
      tags:
      - Bookings
  /bookings/{id}:
    delete:
      description: Cancel an existing booking belonging to the authenticated user.
        The booking is marked as cancelled instead of being deleted.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a booking
      tags:
      - Bookings
    get:
      description: Get a booking by ID. Customers can only view their own bookings,
        while admins and managers can view any booking.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get booking by ID
      tags:
      - Bookings
    put:
      consumes:
      - application/json
      description: Update an existing booking. Customers can only update their own
        bookings.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated booking data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a booking
      tags:
      - Bookings
  /bookings/{id}/payment:
    post:
      consumes:
      - application/json
      description: Creates a payment for the authenticated user's booking.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: Payment data
        in: body
        name: request
        required: true
        schema:
          properties:
            payment_method:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create payment
      tags:
      - Payments
  /bookings/{id}/status:
    patch:
      consumes:
      - application/json
      description: Confirm or cancel a booking. Admin and manager users only.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: Booking status
        in: body
        name: request
        required: true
        schema:
          properties:
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update booking status
      tags:
      - Bookings
  /bookings/my:
    get:
      description: Get all bookings belonging to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_booking_model.Booking'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my bookings
      tags:
      - Bookings
  /favorites:
    get:
      description: Get all hotels saved as favorites by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
