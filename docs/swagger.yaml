      tags:
      - Hotels
  /hotels/{id}/details:
    get:
      description: Retrieve a hotel with all of its rooms.
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Hotel details retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Hotel not found
          schema:
            additionalProperties: true
            type: object
        "500":
