  /hotels:
    get:
      description: Retrieve all hotels.
      produces:
      - application/json
      responses:
        "200":
          description: Hotels retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to get hotels
          schema:
            additionalProperties: true
            type: object
      summary: Get all hotels
      tags:
      - Hotels
    post:
      consumes:
      - application/json
      description: Create a new hotel.
      parameters:
      - description: Hotel data
        in: body
        name: hotel
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_hotel_model.Hotel'
      produces:
      - application/json
      responses:
        "201":
          description: Hotel created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel data or validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a hotel
      tags:
      - Hotels
  /hotels/{hotel_id}/rooms:
    get:
      description: Retrieve all rooms belonging to a specific hotel.
      parameters:
      - description: Hotel ID
        in: path
        name: hotel_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Rooms retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel ID
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to get rooms
          schema:
            additionalProperties: true
            type: object
      summary: Get rooms by hotel ID
      tags:
      - Rooms
    post:
      consumes:
      - application/json
      description: Create a new room for a hotel.
      parameters:
      - description: Hotel ID
        in: path
        name: hotel_id
        required: true
        type: integer
      - description: Room data
        in: body
        name: room
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_room_model.Room'
      produces:
      - application/json
      responses:
        "201":
          description: Room created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel ID, request body, or validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Hotel not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a room
      tags:
      - Rooms
  /hotels/{id}:
    delete:
      description: Delete an existing hotel.
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Hotel deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Hotel not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete hotel
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a hotel
      tags:
      - Hotels
    get:
      description: Retrieve a hotel using its ID.
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Hotel retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Hotel not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to get hotel
          schema:
            additionalProperties: true
            type: object
      summary: Get hotel by ID
      tags:
      - Hotels
    put:
      consumes:
      - application/json
      description: Update an existing hotel.
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated hotel data
        in: body
        name: hotel
        required: true
        schema:
          $ref: '#/definitions/github_com_Mosteben_hotel-booking-system_internal_hotel_model.Hotel'
      produces:
      - application/json
      responses:
        "200":
          description: Hotel updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid hotel data or validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Hotel not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
